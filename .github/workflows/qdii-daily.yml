name: QDII Nav Daily

# 每日自动运行（美股交易日 · 盘后 · 北京时间 06:00）
# =====================================================================
# 设计依据 —— QDII 净值数据更新节奏（北京时间）：
#   美东 T 日 16:00 收盘 = 北京 T+1 日凌晨 4~5 点 → 北京 T+1 日晚
#   公布净值（净值日期 T+1，对应美股 ≤T+1 最新收盘 = 美股 T 日收盘）。
#
# 因此：北京 T+1 日 06:00 运行时，美股 T 日已收盘，今晚净值将更新，
# 可用美股 T 日收盘数据预测今晚净值（lag=0 对齐，用户已验证）。
#
# 触发方式（单通道，2026-08-27 起）：
#   由 Cloudflare Worker qdii-dispatch（cron "0 22 * * 1-5" UTC = 北京
#   工作日 06:00）调用 GitHub API workflow_dispatch 触发本工作流，
#   绕开 GitHub Actions schedule 共享队列（偶发延迟/静默跳过）。
#   GitHub 侧不再配置 schedule（避免双通道重复触发）。
#
# 三道闸门（参照 xiaoxu-fear 仓的时间门控设计）：
#   1) 触发日：Cloudflare cron 工作日 06:00（北京）
#   2) 美股交易日判断：NYX 日历（pandas_market_calendars）精确排除
#      美东节假日/周末（美东昨日是否为交易日）
#   3) 盘后判断：北京 06:00 必然已过美股收盘（美东 16:00 = 北京 4~5 点）
#      —— 保留时区校验代码以防执行时段变化
#
# 手动触发（workflow_dispatch）：任意时间强制运行（取最近交易日数据）
# =====================================================================
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # 交易日 & 盘后窗口判断（北京时间 06:00 → 美东当日已收盘：美东16:00=北京次日4-5点）
      # 非交易日（美东节假日/周末）→ trade=0 跳过
      - name: 判断美股交易日与盘后窗口
        id: check
        run: |
          python - <<'PY'
          import os, datetime
          import pandas_market_calendars as mcal
          BJ = datetime.timezone(datetime.timedelta(hours=8))
          now_bj = datetime.datetime.now(BJ)
          today = now_bj.strftime("%Y-%m-%d")
          # 北京 06:00 = 美东前一日 18:00 → 美东昨日已收盘。判断美东昨日是否交易日
          us_prev = (now_bj - datetime.timedelta(days=1)).strftime("%Y-%m-%d")
          nyse = mcal.get_calendar("NYSE")
          sched = nyse.schedule(start_date=us_prev, end_date=us_prev)
          is_trade = len(sched) > 0
          if not is_trade:
              print(f"{today} 美东昨日({us_prev})非交易日（节假日/周末），跳过")
              open(os.environ["GITHUB_OUTPUT"], "a").write("trade=0\n")
              raise SystemExit(0)
          # 盘后校验：美东收盘 = 北京 4~5 点，06:00 必已收盘（防御性检查）
          if now_bj.hour < 5:
              print(f"{today} 美股尚未收盘（{now_bj.strftime('%H:%M')} 北京时间），跳过")
              open(os.environ["GITHUB_OUTPUT"], "a").write("trade=0\n")
              raise SystemExit(0)
          print(f"{today} 美东昨日({us_prev})交易日且已收盘，执行 QDII 净值分析")
          open(os.environ["GITHUB_OUTPUT"], "a").write("trade=1\n")
          PY

      - name: Run QDII nav analysis
        if: steps.check.outputs.trade == '1' || github.event_name == 'workflow_dispatch'
        run: python scripts/run_daily.py --out output

      - name: Render static HTML
        if: steps.check.outputs.trade == '1' || github.event_name == 'workflow_dispatch'
        run: python scripts/render_html.py --json output/daily_report.json --history output/predictions.jsonl --out docs/index.html

      - name: Commit outputs
        if: steps.check.outputs.trade == '1' || github.event_name == 'workflow_dispatch'
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: daily QDII nav update (${{ github.run_id }})"
          file_pattern: "output/* docs/*"